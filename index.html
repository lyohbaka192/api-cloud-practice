<html>
<head>
    <title>Мой первый API клиент</title>
</head>
<body>
    <h1>Список пользователей из облака</h1>
    <button id="loadBtn">Загрузить данные через API</button>
    <ul id="userList"></u1>

    <script>
    const button = document.getElementById('loadBtn');
    const list = document.getElementById('userList');

    button.addEventListener('click',async () =>{
        button.innerText = 'Загрузка...';

        const response = await fetch('https://pokeapi.co/api/v2/pokemon/pikachu');
         const data = await response.json();

            list.innerHTML = '';
            
            const li = document.createElement('li');
            li.innerText = `Имя: ${data.name}, Вес: ${data.weight}`;
            list.appendChild(li);


        });

        button.innerText='Данные загружены!';
    });
    </script>
</body>
</html>
